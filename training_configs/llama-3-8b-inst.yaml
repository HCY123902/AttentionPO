# Model arguments
model_name_or_path: meta-llama/Meta-Llama-3-8B-Instruct
torch_dtype: null

# Data training arguments
# For definitions, see: src/h4/training/config.py
dataset_mixer:
  AttentionPO/llama-3-8b-inst-dataset: 1.0
dataset_splits:
- train
- test
preprocessing_num_workers: 12
dataset_num_proc: 16

# DPOTrainer arguments
bf16: true
beta: 0.005
do_eval: true
eval_strategy: steps
eval_steps: 500
gradient_accumulation_steps: 16
gradient_checkpointing: true
gradient_checkpointing_kwargs:
  use_reentrant: False
hub_model_id: llama-3-8b-inst
learning_rate: 1.0e-6
log_level: info
logging_steps: 10
lr_scheduler_type: cosine
max_length: 2048
max_prompt_length: 1800
num_train_epochs: 1
optim: adamw_torch_8bit
output_dir: outputs/llama-3-8b-inst
per_device_train_batch_size: 1
per_device_eval_batch_size: 2
push_to_hub: false
save_strategy: steps
save_steps: 500
save_total_limit: 4
save_only_model: true
seed: 42
warmup_ratio: 0.1
run_name: llama-3-8b-inst
report_to: "wandb"
token_weighted: true
fix_attn_sink: true
attn_source: "31"
max_grad_norm: 1.0
push_to_hub: true
hub_strategy: "all_checkpoints"